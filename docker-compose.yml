services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8059:8059"
      - "8060:8060"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8060/health')"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
