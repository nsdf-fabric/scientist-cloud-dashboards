[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientist-cloud-dashboards"
version = "0.1.0"
description = "DIAL NSDF Bokeh dashboard with FastAPI-triggered S3 refresh"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.10,<4.0"
dependencies = [
  "bokeh>=3.0",
  "boto3>=1.28",
  "fastapi>=0.110",
  "httpx>=0.27",
  "numpy>=1.24",
  "uvicorn>=0.27",
  "scipy"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nsdf_dashboard"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.15",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

